name: Release website image

# website-<version> tags push ghcr.io/tosunlab/tosunlab-website:<version> and :sha-<commit>; the Publish workflow then points :latest at it.
# A website-1.2.3-label tag is a custom build: it gets its own image tag but can't be published.
# Without a tag, a manual run pushes only :sha-<commit> of the chosen branch.
on:
  push:
    tags: ["website-[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing website-<version> tag to build (empty for :sha-<commit> of the chosen branch)
        required: false
        default: ""

concurrency:
  group: release-website-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  WEBSITE_IMAGE: ghcr.io/tosunlab/tosunlab-website

jobs:
  website-image:
    name: Build and push the linux/amd64 website image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Check the tag
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^website-[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "$TAG is not a website-<version> tag"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Choose image tags
        id: imageTag
        run: |
          commit=$(git rev-parse HEAD)
          allImageTag="$WEBSITE_IMAGE:sha-$(git rev-parse --short=8 HEAD)"
          if [ -n "$TAG" ]; then allImageTag="$allImageTag,$WEBSITE_IMAGE:${TAG#website-}"; fi
          {
            echo "commit=$commit"
            echo "allImageTag=$allImageTag"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # linux/amd64, like the server.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.imageTag.outputs.allImageTag }}
          labels: |
            org.opencontainers.image.source=https://github.com/tosunlab/tosunlab-website
            org.opencontainers.image.revision=${{ steps.imageTag.outputs.commit }}
            org.opencontainers.image.title=tosunlab-website
      - run: echo "Pushed ${{ steps.imageTag.outputs.allImageTag }}"
