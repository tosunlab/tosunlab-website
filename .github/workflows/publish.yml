name: Publish

# The deliberate step after a release build: points :latest and :<major>.<minor> at a plain website-MAJOR.MINOR.PATCH image, never a custom build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. website-1.2.3
        required: true

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  WEBSITE_IMAGE: ghcr.io/tosunlab/tosunlab-website

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^website-[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not a plain website-MAJOR.MINOR.PATCH tag; custom builds can't be published"; exit 1; }
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null || { echo "the tag $TAG does not exist"; exit 1; }
          echo "VERSION=${TAG#website-}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Point the latest and MAJOR.MINOR website image tags at the version
        run: |
          docker buildx imagetools inspect "$WEBSITE_IMAGE:$VERSION" >/dev/null || { echo "$WEBSITE_IMAGE:$VERSION does not exist; run Release website image for $TAG first"; exit 1; }
          docker buildx imagetools create -t "$WEBSITE_IMAGE:${VERSION%.*}" -t "$WEBSITE_IMAGE:latest" "$WEBSITE_IMAGE:$VERSION"
          echo "Published $WEBSITE_IMAGE:$VERSION as latest and ${VERSION%.*}"
